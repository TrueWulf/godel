# A minimal VM configuration. Replace paths with programs present in your root.

[service "hostname"]
command = /bin/hostname godel
type = oneshot
restart = never

[service "console"]
command = /sbin/agetty --autologin root --login-program /bin/sh 115200 ttyS0 linux
after = hostname
restart = always
restart_delay = 1s

# Service-specific environment values are passed in addition to HOME, PATH,
# and TERM. Values are whitespace-separated; double and single quotes and
# backslash escapes group words into one argument, exactly like the command
# line.
[service "application"]
command = /usr/local/bin/application --foreground
after = hostname
env = APP_MODE=production APP_PORT=8080
restart = on-failure
restart_limit = 5
restart_delay = 1s

[service "swap"]
# keep swapon's stderr: it lands in the per-service log, which is
# the only way to tell a missing file from wrong perms or a holey
# swapfile when SwapTotal reads 0 in /proc/meminfo
command = /bin/sh -c "swapon /swapfile 2>&1 || echo 'swap: swapon failed'"
type = oneshot
restart = never
after = rootfs-rw

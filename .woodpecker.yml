when:
  - event: push
    branch: main
  - event: pull_request
  - event: tag

steps:
  unit-tests:
    image: alpine:3.22
    commands:
      - apk add --no-cache hare make
      - hare version
      - make test HARE=hare
      - make HARE=hare
      - ./bin/godel -t examples/desktop
      - ./bin/godel -t examples/server
      - sh tools/test-install.sh
      - sh tools/test-compat-install.sh

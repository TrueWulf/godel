[service "fsck-root"]
command = /bin/sh -c "fsck.ext4 -p /dev/vda || echo 'fsck-root: root mounted; kernel journal recovery owns dirty state'"
type = oneshot
restart = never

[service "hostname"]
command = /bin/hostname godel-vm
type = oneshot
restart = never

[service "rootfs-rw"]
command = /bin/mount -o remount,rw /
type = oneshot
restart = never
notification-fd = 3

[service "tmpfs-tmp"]
command = /bin/mount -t tmpfs -o mode=1777 tmpfs /tmp
type = oneshot
restart = never
notification-fd = 3
after = fsck-root

[service "mount-home"]
command = /bin/sh -c "mountpoint -q /home || { fsck.ext4 -p /dev/vdb 2>/dev/null; [ $? -le 1 ] && touch /run/godel/fsck-home-ran; }; mountpoint -q /home || mount /dev/vdb /home 2>/dev/null || echo godel: no /home device, keeping plain directory"
type = oneshot
restart = never
after = rootfs-rw

[service "mount-var"]
command = /bin/sh -c "mountpoint -q /var || { fsck.ext4 -p /dev/vdc 2>/dev/null; [ $? -le 1 ] && touch /run/godel/fsck-var-ran; }; mountpoint -q /var || mount /dev/vdc /var 2>/dev/null || echo godel: no /var device, keeping plain directory"
type = oneshot
restart = never
after = rootfs-rw

[service "ttyS0"]
command = /bin/getty -L 115200 ttyS0 vt100
after = rootfs-rw tmpfs-tmp
restart = always
restart_delay = 1s
shutdown_timeout = 2s

[service "tty1"]
command = /bin/getty -L 0 tty1 linux
after = rootfs-rw tmpfs-tmp
restart = always
restart_delay = 1s
shutdown_timeout = 2s

[service "beacon"]
command = /bin/sh -c "while :; do echo beacon: alive; sleep 30; done"
restart = on-failure
restart_limit = 5
restart_delay = 1s

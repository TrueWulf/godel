# Godel boot configuration for the QEMU test image.
#
# All boot jobs are type = oneshot with restart = never: a failed mount is
# logged and skipped instead of blocking boot. After is start ordering only,
# never readiness. Getty services restart always so a killed console
# recovers automatically.

[service "hostname"]
command = /bin/hostname godel-vm
type = oneshot
restart = never

[service "rootfs-rw"]
command = /bin/mount -o remount,rw /
type = oneshot
restart = never

[service "tmpfs-tmp"]
command = /bin/mount -t tmpfs -o mode=1777 tmpfs /tmp
type = oneshot
restart = never

# Optional mounts: with no matching disk attached these log a line and
# exit 0, leaving the plain directory in place. Run with GODEL_EXTRAS=1
# (tools/run-system.sh) to attach /dev/vdb and /dev/vdc.
[service "mount-home"]
command = /bin/sh -c "mountpoint -q /home || mount /dev/vdb /home 2>/dev/null || echo godel: no /home device, keeping plain directory"
type = oneshot
restart = never

[service "mount-var"]
command = /bin/sh -c "mountpoint -q /var || mount /dev/vdc /var 2>/dev/null || echo godel: no /var device, keeping plain directory"
type = oneshot
restart = never

[service "ttyS0"]
command = /bin/getty -L 115200 ttyS0 vt100
after = rootfs-rw tmpfs-tmp
restart = always
restart_delay = 1s
shutdown_timeout = 2s

[service "tty1"]
command = /bin/getty -L 0 tty1 linux
after = rootfs-rw tmpfs-tmp
restart = always
restart_delay = 1s
shutdown_timeout = 2s

# Visible heartbeat proving continuous supervision across reloads.
[service "beacon"]
command = /bin/sh -c "while :; do echo beacon: alive; sleep 30; done"
restart = on-failure
restart_limit = 5
restart_delay = 1s
